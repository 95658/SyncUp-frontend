    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="28" cy="66" r="7.5" fill="#10B981" />
  <circle cx="28" cy="66" r="3.5" fill="#FFFFFF" />

  <circle cx="50" cy="50" r="5" fill="#FFFFFF" filter="url(#darkGlow)" />
