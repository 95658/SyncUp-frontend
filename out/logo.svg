<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="syncSGrad1" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="syncSGrad2" x1="85%" y1="85%" x2="15%" y2="15%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Upper Loop / Arc of S -->
  <path
    d="M68 28 C68 20 60 14 50 14 C38 14 30 22 30 34 C30 46 40 52 50 56 C62 61 72 67 72 80 C72 92 62 100 50 100 C36 100 28 92 28 84"
    stroke="url(#syncSGrad1)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    style="display:none;" 
  />

  <!-- Connected Modern Geometric Ribbon S -->
  <!-- Top Branch: Swings from mid-center up and hooks right with connection node -->
  <path
    d="M48 50 C40 45 32 40 32 30 C32 20 40 14 52 14 C64 14 72 21 72 32 L72 34"
    stroke="url(#syncSGrad1)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Top Node -->
  <circle cx="72" cy="34" r="7.5" fill="#38BDF8" />
  <circle cx="72" cy="34" r="3.5" fill="#FFFFFF" />

  <!-- Bottom Branch: Swings from mid-center down and hooks left with connection node & arrow -->
  <path
    d="M52 50 C60 55 68 60 68 70 C68 80 60 86 48 86 C36 86 28 79 28 68 L28 66"
    stroke="url(#syncSGrad2)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Bottom Node -->
  <circle cx="28" cy="66" r="7.5" fill="#10B981" />
  <circle cx="28" cy="66" r="3.5" fill="#FFFFFF" />

  <!-- Central Real-time Connection Bridge / Pulse -->
  <circle cx="50" cy="50" r="5" fill="#FFFFFF" filter="url(#glow)" />
</svg>
